name: verify

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          CI: '1'
      # 运行时回归需要浏览器，因此放在 playwright install 之后，而不是并入 pnpm verify
      # （verify 保持无浏览器依赖，本地可以直接跑）。
      - run: pnpm measure:sdk-runtime
        env:
          CI: '1'
